<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Teacher System - EAG TECH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Tajawal', sans-serif;
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: #f8fafc;
      color: #0f172a;
      direction: rtl;
    }
    .container {
      max-width: 650px;
      margin: 40px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 {
      color: #1e293b;
      margin-bottom: 8px;
    }
    p {
      color: #64748b;
      font-size: 15px;
    }
    .btn {
      background-color: #25D366;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s;
    }
    .btn:hover {
      background-color: #1eb956;
    }
    .status-box {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background-color: #f1f5f9;
      color: #334155;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1> Smart Teacher 🚀</h1>
    <p>إدارة حضور الطلاب وإرسال رسائل الغياب تلقائيًا عبر الواتساب</p>

    <div style="margin-top: 30px;">
      <button class="btn" onclick="connectWhatsApp()">إظهار كود QR الواتساب</button>
    </div>

    <div id="status" class="status-box" style="display: none;"></div>
    <div id="qr-container" style="margin-top: 20px;"></div>
  </div>

  <script>
    function connectWhatsApp() {
      const statusDiv = document.getElementById('status');
      statusDiv.style.display = 'block';
      statusDiv.innerText = 'جاري الاتصال بمحرك الواتساب...';
      
      setTimeout(() => {
        statusDiv.innerText = 'تأكد من تشغيل السيرفر لربط الحساب وقراءة الـ QR Code.';
      }, 1500);
    }
  </script>

</body>
</html>
